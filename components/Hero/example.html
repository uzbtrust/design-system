<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Hero</title>
<style>
  body { min-height: 0; margin: 0; padding: 24px; background: var(--bg); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pv-stack { display: flex; flex-direction: column; gap: 20px; }
  .pv-cap { margin-bottom: 10px; }
  body { padding: 0; }
  .login { min-height: 520px; }
  .hero { padding-block: 56px 64px; }
</style>
</head>
<body>
<div class="login">
  <section class="hero wrap">
    <p class="eyebrow hero-eyebrow rise">Hisobot · 2026</p>
    <h1 class="hero-title rise" style="--i: 1">Yil yakunlari.<span class="hero-dim dim">Kam so‘z, aniq raqam.</span></h1>
    <p class="hero-lead rise" style="--i: 2">Bir yilda nima qilindi, nima o‘rganildi va keyin nima bo‘ladi — bir sahifada.</p>
    <div class="hero-actions rise" style="--i: 3">
      <button class="btn btn-primary btn-lg" type="button">Boshlash</button>
      <a class="link-more" href="#">Batafsil</a>
    </div>
  </section>
</div>
</body>
</html>
