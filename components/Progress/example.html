<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Progress</title>
<style>
  body { min-height: 0; margin: 0; padding: 24px; background: var(--bg); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pv-stack { display: flex; flex-direction: column; gap: 20px; }
  .pv-cap { margin-bottom: 10px; }

</style>
</head>
<body>
<div class="pv-stack" style="max-width: 560px">
  <ol class="steps" style="grid-template-columns: repeat(3, 1fr)" aria-label="Bosqich">
    <li class="is-done"><span class="step-dot"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span class="step-label">Qoralama</span></li>
    <li class="is-current" aria-current="step"><span class="step-dot">2</span><span class="step-label">Ko‘rib chiqish</span></li>
    <li><span class="step-dot">3</span><span class="step-label">Tayyor</span></li>
  </ol>
  <section class="sheet-section">
    <h3 class="sheet-section-title">Tarix</h3>
    <ol class="timeline">
      <li><span class="timeline-dot" aria-hidden="true"></span><p><strong>Siz</strong> ko‘rib chiqishga yubordingiz<time>29-okt, 14:05</time></p><p class="timeline-message">Grafiklar yangilandi, xulosa qo‘shildi.</p></li>
      <li><span class="timeline-dot" aria-hidden="true"></span><p><strong>Siz</strong> qoralama yaratdingiz<time>27-okt, 09:40</time></p></li>
      <li><span class="timeline-dot" aria-hidden="true"></span><p><strong>Tizim</strong> shablonni qo‘ydi<time>27-okt, 09:38</time></p></li>
    </ol>
  </section>
</div>
</body>
</html>
