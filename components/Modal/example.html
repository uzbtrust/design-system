<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Modal</title>
<style>
  body { min-height: 640px; margin: 0; padding: 40px 22px; background: var(--bg); text-align: center; }
  .pv-lead { margin-bottom: 16px; color: var(--fg-3); font-size: var(--fs-body); }
  .pv-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: var(--s-7); }
  .pv-fig { padding: 24px; border-radius: var(--r-lg); background: var(--card); text-align: left; }
  .pv-fig strong { display: block; font-size: 40px; font-weight: 600; letter-spacing: var(--track-display); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pv-fig span { color: var(--fg-3); font-size: var(--fs-sm); }
</style>
</head>
<body>
<p class="pv-lead">Bir yillik natijalar va ularning izohi.</p>
<button class="btn btn-secondary" type="button" data-modal="m1">Batafsil</button>

<dialog class="modal" id="m1" aria-labelledby="m1-title">
  <div class="modal-frame">
    <div class="modal-bar">
      <button class="modal-close" type="button" aria-label="Yopish"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
    </div>
    <div class="modal-content" style="text-align: left">
      <p class="eyebrow">Hisobot · 2026</p>
      <h2 class="modal-title" id="m1-title">Bir yil — bir sahifada.</h2>
      <p class="copy-highlight"><strong>Kam so‘z, aniq raqam.</strong> Har bo‘limda bitta asosiy ko‘rsatkich va uning qisqa izohi; tafsilotlar ilovada.</p>
      <div class="pv-figs">
        <div class="pv-fig"><strong>128</strong><span>tayyor hujjat</span></div>
        <div class="pv-fig"><strong>94%</strong><span>muddatida yopilgan</span></div>
        <div class="pv-fig"><strong>12</strong><span>yangi shablon</span></div>
      </div>
    </div>
  </div>
</dialog>
<script>
document.querySelectorAll("[data-modal]").forEach(function (opener) {
  var dlg = document.getElementById(opener.dataset.modal);
  opener.addEventListener("click", function () { dlg.showModal(); });
  dlg.querySelector(".modal-close").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
});
document.getElementById("m1").showModal();
</script>
</body>
</html>
