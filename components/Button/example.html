<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Button</title>
<style>
  body { min-height: 0; margin: 0; padding: 24px; background: var(--bg); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pv-stack { display: flex; flex-direction: column; gap: 20px; }
  .pv-cap { margin-bottom: 10px; }

</style>
</head>
<body>
<div class="pv-stack">
  <div class="pv-row">
    <button class="btn btn-primary" type="button">Saqlash</button>
    <button class="btn btn-secondary" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg> Yangi hujjat</button>
    <button class="btn btn-quiet" type="button">Bekor qilish</button>
    <button class="btn btn-danger" type="button">O‘chirish</button>
    <button class="btn btn-primary" type="button" disabled>Saqlash</button>
  </div>
  <div class="pv-row">
    <button class="btn btn-primary" type="button">Batafsil</button>
    <button class="btn btn-primary btn-sm" type="button">Batafsil</button>
    <button class="btn btn-primary btn-xs" type="button">Yuklab olish</button>
    <button class="btn btn-secondary btn-sm" type="button">Hisobot</button>
    <button class="btn btn-secondary btn-xs" type="button">Hisobot</button>
  </div>
  <div class="pv-row">
    <button class="btn btn-primary btn-lg" type="button">Kirish</button>
    <a class="link-more" href="#">Batafsil</a>
    <button class="btn-text" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /><path d="m15 5 4 4" /></svg> Tahrirlash</button>
    <button class="btn-text is-danger" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6" /><path d="M14 11v6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg> O‘chirish</button>
  </div>
</div>
</body>
</html>
