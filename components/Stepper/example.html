<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Stepper</title>
<style>
  body { min-height: 0; margin: 0; padding: 24px; background: var(--bg); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pv-stack { display: flex; flex-direction: column; gap: 20px; }
  .pv-cap { margin-bottom: 10px; }

</style>
</head>
<body>
<div class="stepper" role="group" aria-label="Sahifalar soni">
  <button type="button" aria-label="Kamaytirish" id="dec"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg></button>
  <input type="number" inputmode="numeric" value="3" min="1" max="99" aria-label="Sahifalar soni" id="val" />
  <button type="button" aria-label="Ko‘paytirish" id="inc"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg></button>
  <span class="stepper-unit">sahifa</span>
</div>
<script>
var v = document.getElementById("val"), dec = document.getElementById("dec");
function set(n) { v.value = Math.max(1, Math.min(99, n)); dec.disabled = Number(v.value) <= 1; }
dec.onclick = function () { set(Number(v.value) - 1); };
document.getElementById("inc").onclick = function () { set(Number(v.value) + 1); };
set(3);
</script>
</body>
</html>
