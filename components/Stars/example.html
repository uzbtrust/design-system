<script>
var star = "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z\" /></svg>";
var picker = document.getElementById("picker"), value = 4, hover = 0;
function render() {
  var shown = hover || value;
  picker.innerHTML = "";
  for (var n = 1; n <= 5; n++) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", n + " yulduz"); b.setAttribute("aria-pressed", String(value === n));
    b.className = n <= shown ? "on" : "";
    b.innerHTML = n <= shown ? star.replace('fill="none"', 'fill="currentColor"') : star;
    (function (n) {
      b.onmouseenter = function () { hover = n; render(); };
      b.onclick = function () { value = value === n ? 0 : n; render(); };
    })(n);
    picker.appendChild(b);
  }
  var s = document.createElement("span"); s.className = "star-picker-value"; s.textContent = value ? value + " / 5" : "Belgilanmagan";
  picker.appendChild(s);
}
picker.onmouseleave = function () { hover = 0; render(); };
render();
</script>
