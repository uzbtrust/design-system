<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../dist/uzbtrust.css">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<title>Logo</title>
<style>
  body { min-height: 0; margin: 0; padding: 24px; background: var(--bg); }
  .pv-logo { display: grid; grid-template-columns: 200px 200px 1fr; gap: 20px; }
  .logo-tile { display: grid; place-items: center; height: 200px; border-radius: var(--r-lg); background: var(--bg-alt); }
  .logo-tile.on-black { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
  .logo-tile img { width: 112px; height: auto; }
  .logo-tile.on-white { background: #ffffff; box-shadow: inset 0 0 0 1px var(--line-soft); }
  .lockups { display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .lockup { display: inline-flex; align-items: center; color: var(--fg); font-weight: 600; letter-spacing: var(--track-body); line-height: 1; }
  .lockup img { display: block; height: auto; }
  .lockup.sm { gap: 9px; font-size: 17px; }
  .lockup.sm img { width: 22px; }
  .lockup.lg { gap: 14px; font-size: 44px; font-weight: 600; letter-spacing: var(--track-display); }
  .lockup.lg img { width: 56px; }
  .lockup-cap { margin: 10px 0 0; color: var(--fg-3); font-size: 12px; }
  .sizes { display: flex; align-items: flex-end; gap: 20px; }
  .sizes figure { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0; color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .caption { margin-top: 10px; color: var(--fg-3); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="pv-logo">
  <div>
    <div class="logo-tile on-white"><img src="../../assets/Logos/uzbtrust-logo.svg" alt="uzbtrust" style="width: 200px"></div>
    <p class="caption">uzbtrust-logo.svg — ikonka, favicon</p>
  </div>
  <div>
    <div class="logo-tile on-black" data-theme="dark"><img src="../../assets/Logos/uzbtrust-star.svg" alt="uzbtrust"></div>
    <p class="caption">Qora fonda ham shu ko‘k</p>
  </div>
  <div class="lockups">
    <div><span class="lockup lg"><img src="../../assets/Logos/uzbtrust-star.svg" alt="">uzbtrust</span><p class="lockup-cap">Veb-sahifada — «uzbtrust»</p></div>
    <div><span class="lockup sm"><img src="../../assets/Logos/uzbtrust-star.svg" alt="">Abdurakhmonov</span><p class="lockup-cap">Faylda (PDF, hujjat, taqdimot, rasm) — «Abdurakhmonov»</p></div>
    <div class="sizes">
      <figure><img src="../../assets/Logos/uzbtrust-star.svg" alt="" width="64">64</figure>
      <figure><img src="../../assets/Logos/uzbtrust-star.svg" alt="" width="32">32</figure>
      <figure><img src="../../assets/Logos/uzbtrust-star.svg" alt="" width="16">16</figure>
    </div>
  </div>
</div>
</body>
</html>
